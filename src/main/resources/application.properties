spring.application.name=zacatlan-api-rest

#Conexion a mariadb
spring.datasource.url=jdbc:mariadb://localhost:3306/zacatlan_api?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
#o se puede usar none en vez de create
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
app.admin.password=${ADMIN_INITIAL_PASSWORD:}
